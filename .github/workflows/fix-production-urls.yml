name: One-time production URL cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-production-urls.yml

permissions:
  contents: write

jobs:
  replace-preview-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace leaked preview URLs and audit metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          old_host = "northwest-security-lock-redesign-pr" + "." + "vercel.app"
          new_base = "https://www.northwestsecurityandlock.com"
          workflow_path = Path(".github/workflows/fix-production-urls.yml")
          changed = []
          replacements = 0

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path == workflow_path:
                  continue
              data = path.read_bytes()
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              updated = text
              for old in (
                  f"https://{old_host}",
                  f"http://{old_host}",
                  f"//{old_host}",
              ):
                  count = updated.count(old)
                  if count:
                      replacements += count
                      updated = updated.replace(old, new_base)

              if old_host in updated:
                  count = updated.count(old_host)
                  replacements += count
                  updated = updated.replace(old_host, "www.northwestsecurityandlock.com")

              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed.append(str(path))

          remaining = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path == workflow_path:
                  continue
              data = path.read_bytes()
              if old_host.encode() in data:
                  remaining.append(str(path))

          if remaining:
              print("Preview domain still remains in:", *remaining, sep="\n- ")
              sys.exit(1)

          robots = Path("robots.txt").read_text(encoding="utf-8")
          expected_sitemap = f"Sitemap: {new_base}/sitemap.xml"
          if expected_sitemap not in robots:
              print("robots.txt does not reference the production sitemap URL")
              sys.exit(1)

          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          locs = re.findall(r"<loc>(.*?)</loc>", sitemap)
          if not locs or any(not loc.startswith(new_base) for loc in locs):
              print("sitemap.xml contains a missing or non-production URL")
              sys.exit(1)

          head_failures = []
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              match = re.search(r"<head\b[^>]*>(.*?)</head>", text, re.I | re.S)
              if not match:
                  continue
              head = match.group(1)
              if old_host in head:
                  head_failures.append(f"{path}: preview domain remains in <head>")
              for tag_pattern, label in (
                  (r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)', "canonical"),
                  (r'<meta\b[^>]*property=["\']og:url["\'][^>]*content=["\']([^"\']+)', "og:url"),
                  (r'<meta\b[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)', "og:image"),
                  (r'<meta\b[^>]*name=["\']twitter:image["\'][^>]*content=["\']([^"\']+)', "twitter:image"),
              ):
                  found = re.search(tag_pattern, head, re.I)
                  if found and found.group(1).startswith(("http://", "https://")):
                      value = found.group(1)
                      if old_host in value:
                          head_failures.append(f"{path}: {label} still uses preview domain")

          if head_failures:
              print(*head_failures, sep="\n")
              sys.exit(1)

          if not changed:
              print("No preview-domain references were found to replace")
              sys.exit(1)

          print(f"Replaced {replacements} preview-domain references across {len(changed)} files:")
          print(*changed, sep="\n")
          PY

      - name: Commit corrected URLs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix canonical and metadata production URLs"
          git push
