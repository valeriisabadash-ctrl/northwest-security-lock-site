<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwest Security & Lock</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#071011;color:#fff;min-height:100%;font-family:Arial,sans-serif}
    main{min-height:100vh;background:#071011}
    img{display:block;width:100%;height:auto;margin:0 auto;background:#071011}
    .loading{min-height:100vh;display:grid;place-items:center;color:#d6a646;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:14px}
    body.ready .loading{display:none}
    body:not(.ready) img{display:none}
  </style>
</head>
<body>
  <main aria-label="Northwest Security & Lock homepage design">
    <div class="loading">Loading preview</div>
    <img id="mockup" alt="Northwest Security & Lock homepage design">
  </main>
  <script>
    (function(){
      var img=document.getElementById('mockup');
      fetch('assets/exact-mockup/00.txt',{cache:'no-store'})
        .then(function(r){return r.text();})
        .then(function(t){img.src='data:image/webp;base64,'+t.trim();document.body.className='ready';})
        .catch(function(){document.querySelector('.loading').textContent='Preview failed to load';});
    })();
  </script>
</body>
</html>
